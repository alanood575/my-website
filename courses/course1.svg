<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="'Amiri','Scheherazade New',serif">
  <defs>
    <linearGradient id="g1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a2f"/>
      <stop offset="1" stop-color="#13261f"/>
    </linearGradient>
    <linearGradient id="g1gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c96a"/>
      <stop offset="1" stop-color="#b8923a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#g1bg)"/>
  <rect x="28" y="28" width="744" height="744" rx="18" fill="none" stroke="url(#g1gold)" stroke-width="2.5" opacity="0.85"/>
  <rect x="42" y="42" width="716" height="716" rx="12" fill="none" stroke="url(#g1gold)" stroke-width="1" opacity="0.4"/>

  <!-- decorative leaf top-left -->
  <g stroke="url(#g1gold)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M90 150 q60 -50 150 -30"/>
    <path d="M120 140 q10 -22 34 -26"/>
    <path d="M150 130 q10 -22 34 -26"/>
    <path d="M180 124 q10 -22 34 -26"/>
  </g>

  <text x="400" y="150" text-anchor="middle" fill="url(#g1gold)" font-size="42" letter-spacing="6">— دورات —</text>
  <text x="400" y="270" text-anchor="middle" fill="#f3ead1" font-size="118" font-weight="700">الخط العربي</text>
  <text x="400" y="345" text-anchor="middle" fill="url(#g1gold)" font-size="48" font-weight="700">تعلّم .. تدرّب .. أتقن</text>

  <!-- feature pills -->
  <g font-size="30" fill="#e9e0c8">
    <circle cx="250" cy="440" r="9" fill="none" stroke="url(#g1gold)" stroke-width="2"/><path d="M245 440 l4 4 7 -8" stroke="url(#g1gold)" stroke-width="2" fill="none"/>
    <text x="540" y="450" text-anchor="end">دورات لجميع المستويات</text>
    <circle cx="250" cy="500" r="9" fill="none" stroke="url(#g1gold)" stroke-width="2"/><path d="M245 500 l4 4 7 -8" stroke="url(#g1gold)" stroke-width="2" fill="none"/>
    <text x="540" y="510" text-anchor="end">تعلّم على يد متخصصين</text>
    <circle cx="250" cy="560" r="9" fill="none" stroke="url(#g1gold)" stroke-width="2"/><path d="M245 560 l4 4 7 -8" stroke="url(#g1gold)" stroke-width="2" fill="none"/>
    <text x="540" y="570" text-anchor="end">مواد تعليمية شاملة</text>
    <circle cx="250" cy="620" r="9" fill="none" stroke="url(#g1gold)" stroke-width="2"/><path d="M245 620 l4 4 7 -8" stroke="url(#g1gold)" stroke-width="2" fill="none"/>
    <text x="540" y="630" text-anchor="end">شهادة معتمدة</text>
  </g>

  <!-- pen icon -->
  <g transform="translate(600 470) rotate(35)" stroke="url(#g1gold)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 L18 0 L9 120 Z" fill="url(#g1gold)" opacity="0.25"/>
    <path d="M0 0 L18 0 L9 120 Z"/>
    <line x1="9" y1="40" x2="9" y2="95"/>
  </g>

  <rect x="200" y="690" width="400" height="60" rx="30" fill="none" stroke="url(#g1gold)" stroke-width="2"/>
  <text x="400" y="730" text-anchor="middle" fill="url(#g1gold)" font-size="30">ابدأ رحلتك في عالم الخط العربي</text>
</svg>
